<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heritage-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:0.1"/>
    </linearGradient>
    <pattern id="heritage-pattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="8" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.4"/>
      <circle cx="30" cy="30" r="4" fill="#daa520" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#heritage-bg)"/>
  <rect width="400" height="400" fill="url(#heritage-pattern)"/>

  <!-- Vintage frame design -->
  <rect x="50" y="50" width="300" height="300" fill="none" stroke="#8b4513" stroke-width="8"/>
  <rect x="60" y="60" width="280" height="280" fill="none" stroke="#daa520" stroke-width="2"/>
  <rect x="70" y="70" width="260" height="260" fill="none" stroke="#8b4513" stroke-width="1" opacity="0.5"/>

  <!-- Corner decorations -->
  <circle cx="50" cy="50" r="15" fill="#daa520" opacity="0.8"/>
  <circle cx="350" cy="50" r="15" fill="#daa520" opacity="0.8"/>
  <circle cx="50" cy="350" r="15" fill="#daa520" opacity="0.8"/>
  <circle cx="350" cy="350" r="15" fill="#daa520" opacity="0.8"/>

  <text x="200" y="190" text-anchor="middle" font-family="serif" font-size="24" fill="#2d3748" opacity="0.8">Heritage</text>
  <text x="200" y="220" text-anchor="middle" font-family="serif" font-size="16" fill="#4a5568" opacity="0.6">Collection</text>
</svg>
