<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kaleidoscope-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#4ecdc4;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#45b7d1;stop-opacity:0.1"/>
    </linearGradient>
    <pattern id="kaleidoscope-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <polygon points="20,5 35,20 20,35 5,20" fill="#ff6b6b" opacity="0.3"/>
      <polygon points="20,5 35,20 20,35 5,20" fill="#4ecdc4" opacity="0.3" transform="rotate(45 20 20)"/>
      <polygon points="20,5 35,20 20,35 5,20" fill="#45b7d1" opacity="0.3" transform="rotate(90 20 20)"/>
    </pattern>
  </defs>

  <rect width="400" height="400" fill="url(#kaleidoscope-bg)"/>
  <rect width="400" height="400" fill="url(#kaleidoscope-pattern)"/>

  <circle cx="200" cy="200" r="120" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="0.7"/>
  <circle cx="200" cy="200" r="80" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.7"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#45b7d1" stroke-width="2" opacity="0.7"/>

  <text x="200" y="190" text-anchor="middle" font-family="serif" font-size="24" fill="#2d3748" opacity="0.8">Kaleidoscope</text>
  <text x="200" y="220" text-anchor="middle" font-family="serif" font-size="16" fill="#4a5568" opacity="0.6">Collection</text>
</svg>
